[package]
name = "renantalk-config"
version = "0.1.0"
edition = "2021"
description = "Janela de configurações do RenanTalk (Tauri)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
opt-level = "s"
lto = "thin"        # compila bem mais rápido que "fat", binário quase do mesmo tamanho
codegen-units = 16
strip = true
panic = "abort"
