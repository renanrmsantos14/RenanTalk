name: Release

# Todo push na main que mexe no app gera um release novo (PATCH + 1).
# O RenanTalk instalado procura releases a cada 6 h e se atualiza sozinho.
on:
  push:
    branches: [main]
    paths: ["app/**", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checar sintaxe
        run: python3 -m py_compile app/*.py app/*.pyw

      - name: Próxima versão
        id: v
        run: |
          ultima=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          [ -z "$ultima" ] && ultima=v0.0.0
          IFS=. read -r maior menor patch <<< "${ultima#v}"
          nova="$maior.$menor.$((patch + 1))"
          echo "versao=$nova" >> "$GITHUB_OUTPUT"
          echo "data=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Empacotar
        run: |
          echo "${{ steps.v.outputs.versao }} · ${{ steps.v.outputs.data }}" > app/VERSION
          cp requirements.txt app/
          cd app && zip -r ../RenanTalk.zip . -x '__pycache__/*'

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.versao }}" RenanTalk.zip \
            --title "RenanTalk v${{ steps.v.outputs.versao }}" \
            --notes "Publicado em ${{ steps.v.outputs.data }} (America/Sao_Paulo). O app instalado se atualiza sozinho em até 6 h, ou pelo menu **Procurar atualização**." \
            --target "${{ github.sha }}"
