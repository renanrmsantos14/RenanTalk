name: Release

# PR para a main: compila e checa (não publica).
# Merge/push na main que mexe no app, na janela, no Android ou no app em Rust: release novo (PATCH + 1) com Windows,
# Linux, o APK e o app em Rust (apps/desktop: instalador NSIS, AppImage e o latest.json assinado do updater).
# O RenanTalk instalado procura releases a cada 6 h (ou pelo menu) e se atualiza sozinho.
# A janela em Rust só é recompilada quando config/ ou app/ui/ mudam; senão, reaproveita os
# executáveis do último release (release em ~1 min em vez de vários).
on:
  push:
    branches: [main]
    paths: ["app/**", "config/**", "android/**", "requirements.txt", "apps/**", "crates/**", "Cargo.*", "package.json", "pnpm-*", ".github/workflows/release.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", "config/**", "android/**", "requirements.txt", "apps/**", "crates/**", "Cargo.*", "package.json", "pnpm-*", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      data: ${{ steps.v.outputs.data }}
      recompilar: ${{ steps.v.outputs.recompilar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checar sintaxe do Python
        run: python3 -m py_compile app/*.py app/*.pyw
      - name: Próxima versão
        id: v
        run: |
          ultima=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          [ -z "$ultima" ] && ultima=v0.0.0
          IFS=. read -r maior menor patch <<< "${ultima#v}"
          echo "versao=$maior.$menor.$((patch + 1))" >> "$GITHUB_OUTPUT"
          echo "data=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" >> "$GITHUB_OUTPUT"
          # A janela embute app/ui; sem mudança ali nem em config/ desde o último release, reaproveita o binário.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$ultima" = "v0.0.0" ]              || ! gh release view "$ultima" --json assets --jq '.assets[].name' 2>/dev/null | grep -q RenanTalk-linux.zip              || ! git diff --quiet "$ultima" HEAD -- config app/ui; then
            echo "recompilar=true" >> "$GITHUB_OUTPUT"
          else
            echo "recompilar=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ultima=$ultima" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  janela:
    needs: versao
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: renantalk-config.exe
            nome: windows
          - os: ubuntu-22.04
            bin: renantalk-config
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Reaproveitar a janela do último release (sem mudanças nela)
        if: needs.versao.outputs.recompilar != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacote=$([ "${{ matrix.nome }}" = "windows" ] && echo RenanTalk.zip || echo RenanTalk-linux.zip)
          gh release download --repo "${{ github.repository }}" --pattern "$pacote" --dir anterior
          mkdir -p config/target/release
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extract(sys.argv[2], 'config/target/release')" "anterior/$pacote" "${{ matrix.bin }}"
      - name: Dependências do Tauri (Linux, com cache)
        if: needs.versao.outputs.recompilar == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        if: needs.versao.outputs.recompilar == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.versao.outputs.recompilar == 'true'
        with:
          workspaces: config
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Compilar janela de configurações
        if: needs.versao.outputs.recompilar == 'true'
        run: cargo build --release --manifest-path config/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: janela-${{ matrix.nome }}
          path: config/target/release/${{ matrix.bin }}

  android:
    # App Android (bolha de ditado, em android/). PR: testes + APK de depuração. Main: APK assinado com a mesma versão.
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Testar e compilar (PR)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Testar e compilar APK assinado
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/renantalk.jks"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/renantalk.jks"
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PversaoNome="${{ needs.versao.outputs.versao }}" -PversaoData="${{ needs.versao.outputs.data }}"
          rm -f "$RUNNER_TEMP/renantalk.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../RenanTalk.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android
          path: RenanTalk.apk

  desktop:
    # App em Rust (apps/desktop) com a versão da tag. PR: só compila, sem assinar e sem secrets.
    # Main: assina os pacotes do updater (TAURI_SIGNING_PRIVATE_KEY*) e entrega ao job release.
    needs: versao
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pacote: nsis
            nome: windows
          - os: ubuntu-22.04
            pacote: appimage
            nome: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RENANTALK_VERSAO: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri e do áudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4 # a versão vem do packageManager do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: pnpm install --frozen-lockfile
      # package.json, version.json, tauri.conf.json e a crate com a versão da tag (o app mostra a mesma do release).
      - name: Versão da tag
        run: node apps/desktop/scripts/bump-version.mjs
      - name: Compilar (PR, sem assinar)
        if: github.event_name == 'pull_request'
        working-directory: apps/desktop
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/sem-assinatura.json"
          pnpm tauri build --bundles ${{ matrix.pacote }} --config "$RUNNER_TEMP/sem-assinatura.json"
      - name: Compilar e assinar
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.pacote }}
      - name: Separar instalador e assinatura
        if: github.event_name != 'pull_request'
        run: |
          mkdir pacote
          cp target/release/bundle/${{ matrix.pacote }}/RenanTalk_${RENANTALK_VERSAO}_*.{exe,AppImage}{,.sig} pacote/ 2>/dev/null || true
          ls -l pacote
          [ "$(ls pacote/*.sig | wc -l)" = 1 ]
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: desktop-${{ matrix.nome }}
          path: pacote/

  release:
    # O APK e o app em Rust não seguram Windows/Linux do Python: se o job android ou desktop falhar, o release sai sem eles.
    needs: [versao, janela, android, desktop]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.versao.result == 'success' && needs.janela.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Empacotar
        run: |
          echo "${{ needs.versao.outputs.versao }} · ${{ needs.versao.outputs.data }}" > app/VERSION
          cp requirements.txt app/
          rm -rf app/__pycache__
          cp -r app pacote-windows && cp dist/janela-windows/renantalk-config.exe pacote-windows/
          cp -r app pacote-linux && cp dist/janela-linux/renantalk-config pacote-linux/ && chmod +x pacote-linux/renantalk-config
          (cd pacote-windows && zip -qr ../RenanTalk.zip .)
          (cd pacote-linux && zip -qr ../RenanTalk-linux.zip .)
          [ -f dist/android/RenanTalk.apk ] && cp dist/android/RenanTalk.apk . || echo "::warning::Release sem RenanTalk.apk (job android falhou)"
          cp dist/desktop-*/* . 2>/dev/null || echo "::warning::Release sem o app em Rust (job desktop falhou)"
      - name: latest.json do updater (app em Rust)
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          v = os.environ["VERSAO"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/v{v}/"
          plataformas = {}
          for chave, padrao in (("windows-x86_64", f"RenanTalk_{v}_x64-setup.exe"), ("linux-x86_64", f"RenanTalk_{v}_amd64.AppImage")):
              for f in glob.glob(padrao):
                  plataformas[chave] = {"signature": open(f + ".sig").read().strip(), "url": base + f}
          if plataformas:
              json.dump({"version": v, "notes": f"RenanTalk v{v}",
                         "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                         "platforms": plataformas}, open("latest.json", "w"), indent=2)
          print("latest.json:", sorted(plataformas) or "não gerado")
          PY
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.versao.outputs.versao }}" RenanTalk.zip RenanTalk-linux.zip $(ls RenanTalk.apk RenanTalk_* latest.json 2>/dev/null) \
            --title "RenanTalk v${{ needs.versao.outputs.versao }}" \
            --notes "Publicado em ${{ needs.versao.outputs.data }} (America/Sao_Paulo). RenanTalk.zip = Windows; RenanTalk-linux.zip = Linux; RenanTalk.apk = app Android (bolha de ditado). RenanTalk_*_x64-setup.exe e RenanTalk_*_amd64.AppImage = app novo em Rust (em teste; se atualiza pelo latest.json). O app instalado se atualiza sozinho em até 6 h, ou pelo menu **Procurar atualização**." \
            --target "${{ github.sha }}"
